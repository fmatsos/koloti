name: Ping Supabase (anti-pause free tier)

on:
  schedule:
    # Toutes les 3 jours à 08h00 UTC (bien en dessous des 7 jours de pause)
    - cron: "0 8 */3 * *"
  workflow_dispatch: # Déclenchement manuel possible

jobs:
  ping:
    name: Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping app health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "Ping failed with status $STATUS"
            exit 1
          fi
          echo "Ping OK (HTTP $STATUS)"

      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "Supabase REST ping status: $STATUS"
          # On ne fail pas ici — le ping de l'app suffit
